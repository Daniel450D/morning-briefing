<!DOCTYPE html>
<script type="application/json" id="cowork-artifact-meta">
{
  "name": "Morning Briefing",
  "schemaVersion": 1,
  "description": "Tägliches Morgen-Briefing Dashboard für Daniel: KI-News, Datacenter/Infrastruktur-News (Dell, NVIDIA, Lenovo, IBM, NetApp, Veeam, HPE, Everpure), deutsche Wirtschaft/Mittelstand, sowie Börsencharts für CANCOM, NVIDIA, Invesco NASDAQ-100, Invesco MSCI World, iShares Clean Energy, Amundi DAX 3x und MSCI Europe.",
  "mcpTools": [],
  "mcpServerNames": []
}
</script>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Morgen-Briefing</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<style>
:root {
  color-scheme: light;
  --bg:        #f0f4f8;
  --surface:   #ffffff;
  --border:    #e2e8f0;
  --accent:    #2563eb;
  --accent-lt: #eff6ff;
  --green:     #16a34a;
  --red:       #dc2626;
  --text:      #1e293b;
  --muted:     #64748b;
  --muted-lt:  #f8fafc;
  --shadow:    0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0 }
body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif; font-size:13px; line-height:1.5; padding:16px }

/* Header */
.header { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:13px 18px; display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; box-shadow:var(--shadow) }
.header h1 { font-size:1.18rem; font-weight:700; letter-spacing:-.02em }
.header .date { color:var(--muted); font-size:.77rem; margin-top:2px }
.header .meta { color:var(--muted); font-size:.73rem; text-align:right }

/* Section label */
.sec { font-size:.63rem; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin:14px 0 8px; display:flex; align-items:center; gap:8px }
.sec::after { content:''; flex:1; height:1px; background:var(--border) }

/* News grid */
.news-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:14px }
.card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px; box-shadow:var(--shadow) }
.card-title { font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); margin-bottom:10px }

/* Loading */
.loading { display:flex; align-items:center; gap:7px; color:var(--muted); font-size:.8rem; padding:10px 0 }
.spinner { width:13px; height:13px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; flex-shrink:0 }
@keyframes spin { to { transform:rotate(360deg) } }

/* Bullets */
.bullets { list-style:none; display:flex; flex-direction:column; gap:7px }
.bullets li { font-size:.79rem; line-height:1.55; color:#334155; padding-left:13px; position:relative }
.bullets li::before { content:'›'; position:absolute; left:0; color:var(--accent); font-weight:700 }

/* Info note */
.info-note { background:var(--accent-lt); border:1px solid #bfdbfe; border-radius:7px; padding:7px 10px; font-size:.7rem; color:#1e40af; margin-top:10px }

/* Stocks */
.stocks-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px }
.stock-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:11px 12px 10px; box-shadow:var(--shadow) }
.s-sym  { font-size:.59rem; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.06em }
.s-name { font-size:.72rem; font-weight:600; color:var(--text); line-height:1.3; margin:3px 0 8px; min-height:28px }
.s-price { font-size:1rem; font-weight:700; letter-spacing:-.02em }
.s-chg  { font-size:.7rem; font-weight:600; margin:1px 0 7px }
.pos { color:var(--green) } .neg { color:var(--red) }
.chart-box { height:52px }
.s-connector { font-size:.69rem; color:var(--muted); background:var(--muted-lt); border-radius:5px; padding:6px 8px; margin-top:4px; line-height:1.4 }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>☀️ Guten Morgen, Daniel</h1>
    <div class="date" id="hdate"></div>
  </div>
  <div class="meta" id="hmeta">Lade Daten …</div>
</div>

<div class="sec">📰 Nachrichten-Briefing</div>
<div class="news-grid">
  <div class="card">
    <div class="card-title">🤖 KI &amp; Modelle</div>
    <div id="ai-body"><div class="loading"><div class="spinner"></div>Frage KI-Modell …</div></div>
  </div>
  <div class="card">
    <div class="card-title">🏢 Datacenter &amp; Infrastruktur</div>
    <div id="dc-body"><div class="loading"><div class="spinner"></div>Frage KI-Modell …</div></div>
  </div>
  <div class="card">
    <div class="card-title">🇩🇪 Deutsche Wirtschaft</div>
    <div id="eco-body"><div class="loading"><div class="spinner"></div>Frage KI-Modell …</div></div>
  </div>
</div>

<div class="sec">📈 Börsenübersicht</div>
<div class="stocks-grid" id="sgrid"></div>

<script>
// ── Config ────────────────────────────────────────────────────────────
const STOCKS = [
  { name:'CANCOM SE',           ticker:'CAN.DE',  sym:'CAN'  },
  { name:'NVIDIA',              ticker:'NVDA',    sym:'NVDA' },
  { name:'Invesco NASDAQ-100',  ticker:'EQQQ.DE', sym:'EQQQ' },
  { name:'Invesco MSCI World',  ticker:'MXWO.DE', sym:'MXWO' },
  { name:'iSh. Clean Energy',   ticker:'IQQH.DE', sym:'IQQH' },
  { name:'Amundi DAX 3×',       ticker:'3DAL.DE', sym:'3DAL' },
  { name:'MSCI Europe',         ticker:'SMEA.PA', sym:'SMEA' },
];

// ── Date ──────────────────────────────────────────────────────────────
const NOW = new Date();
document.getElementById('hdate').textContent = NOW.toLocaleDateString('de-DE',
  { weekday:'long', year:'numeric', month:'long', day:'numeric' });

// ── Helpers ───────────────────────────────────────────────────────────
function extractText(val) {
  if (typeof val === 'string') return val;
  if (!val) return '';
  if (typeof val.text    === 'string') return val.text;
  if (typeof val.content === 'string') return val.content;
  if (typeof val.message === 'string') return val.message;
  if (Array.isArray(val.content))
    return val.content.map(b => b.text || b.content || '').join('\n');
  return JSON.stringify(val);
}

function renderBullets(raw) {
  const text = extractText(raw);
  const lines = text.split('\n')
    .map(l => l.replace(/^[\-\*•·\d]+[\.\)]\s*/,'').trim())
    .filter(l => l.length > 8)
    .slice(0, 6);
  if (!lines.length) return `<p style="color:var(--muted);font-size:.8rem">${text}</p>`;
  return `<ul class="bullets">${lines.map(l => `<li>${l}</li>`).join('')}</ul>`;
}

// ── News: sequential askClaude calls ─────────────────────────────────
const NEWS = [
  {
    id: 'ai-body',
    prompt: 'Nenne 5 der wichtigsten aktuellen KI-Entwicklungen (neue Modelle, Ankündigungen von OpenAI/Google/Anthropic/Meta/Mistral, Forschung). Antwort: 5 Bulletpoints auf Deutsch, jeder beginnt mit -'
  },
  {
    id: 'dc-body',
    prompt: 'Nenne 5 wichtige aktuelle Entwicklungen im Bereich Rechenzentren und IT-Infrastruktur. Fokus auf Dell, NVIDIA, Lenovo, IBM, NetApp, Veeam, HPE, Everpure. Antwort: 5 Bulletpoints auf Deutsch, jeder beginnt mit -'
  },
  {
    id: 'eco-body',
    prompt: 'Nenne 5 wichtige aktuelle Entwicklungen in der deutschen Wirtschaft, besonders im Mittelstand: IT-Investitionen, KI-Einführung, Digitalisierung, wirtschaftliche Lage. Antwort: 5 Bulletpoints auf Deutsch, jeder beginnt mit -'
  },
];

async function loadNewsSections() {
  for (const section of NEWS) {
    try {
      const result = await window.cowork.askClaude(section.prompt, []);
      let html = renderBullets(result);
      html += `<div class="info-note">ℹ️ Basierend auf Modell-Wissen — für Live-News einen RSS-Connector hinzufügen.</div>`;
      document.getElementById(section.id).innerHTML = html;
    } catch(e) {
      document.getElementById(section.id).innerHTML =
        `<p style="color:var(--muted);font-size:.8rem">Fehler: ${e.message}</p>`;
    }
  }
}

// ── Stocks: try Yahoo Finance, show placeholder if blocked ────────────
async function fetchStock(ticker) {
  const url = `https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=5m&range=1d&includePrePost=false`;
  const r = await fetch(url, { signal: AbortSignal.timeout(8000), headers: { Accept: 'application/json' } });
  const j = await r.json();
  const res = j?.chart?.result?.[0];
  if (!res) throw new Error('no data');
  const meta = res.meta;
  const raw  = res.indicators?.quote?.[0]?.close || [];
  let last = null;
  const closes = raw.map(v => { if (v != null) last = v; return last; });
  return { price: meta.regularMarketPrice, prev: meta.chartPreviousClose ?? meta.previousClose, currency: meta.currency || '', closes };
}

function drawChart(canvasId, closes, isPos) {
  const el = document.getElementById(canvasId);
  if (!el) return;
  const col = isPos ? '#16a34a' : '#dc2626';
  new Chart(el, {
    type: 'line',
    data: {
      labels: closes.map((_,i) => i),
      datasets: [{ data: closes, borderColor: col, borderWidth: 1.5, fill: true, backgroundColor: col + '18', pointRadius: 0, tension: 0.4 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      plugins: { legend: { display: false }, tooltip: { enabled: false } },
      scales: { x: { display: false }, y: { display: false } }
    }
  });
}

async function loadStocks() {
  const grid = document.getElementById('sgrid');
  // Skeletons
  for (const s of STOCKS) {
    const div = document.createElement('div');
    div.className = 'stock-card'; div.id = 'sc_' + s.sym;
    div.innerHTML = `<div class="s-sym">${s.sym}</div><div class="s-name">${s.name}</div><div class="loading"><div class="spinner"></div></div>`;
    grid.appendChild(div);
  }
  // Load in parallel
  await Promise.all(STOCKS.map(async s => {
    const card = document.getElementById('sc_' + s.sym);
    const cid  = 'cv_' + s.sym;
    try {
      const d   = await fetchStock(s.ticker);
      const chg = d.prev ? (d.price - d.prev) / d.prev * 100 : 0;
      const pos = chg >= 0;
      const fmt = v => v != null ? v.toFixed(2) : '–';
      card.innerHTML = `
        <div class="s-sym">${s.sym}</div>
        <div class="s-name">${s.name}</div>
        <div class="s-price">${d.currency} ${fmt(d.price)}</div>
        <div class="s-chg ${pos ? 'pos' : 'neg'}">${pos ? '▲' : '▼'} ${Math.abs(chg).toFixed(2)} %</div>
        <div class="chart-box"><canvas id="${cid}"></canvas></div>`;
      requestAnimationFrame(() => drawChart(cid, d.closes.filter(v => v != null), pos));
    } catch {
      // Show placeholder with connector hint
      const placeholder = generateSparkline();
      card.innerHTML = `
        <div class="s-sym">${s.sym}</div>
        <div class="s-name">${s.name}</div>
        <div class="chart-box" style="margin-bottom:6px"><canvas id="${cid}-ph"></canvas></div>
        <div class="s-connector">🔌 Finanz-Connector für Live-Kurse benötigt</div>`;
      requestAnimationFrame(() => drawPlaceholderChart(cid + '-ph'));
    }
  }));
}

// Placeholder chart (gray sine-ish wave)
function drawPlaceholderChart(canvasId) {
  const el = document.getElementById(canvasId);
  if (!el) return;
  const pts = Array.from({length: 40}, (_, i) =>
    50 + 8 * Math.sin(i * 0.4) + 3 * Math.sin(i * 1.1) + (Math.random() - 0.5) * 2
  );
  new Chart(el, {
    type: 'line',
    data: {
      labels: pts.map((_,i) => i),
      datasets: [{ data: pts, borderColor: '#cbd5e1', borderWidth: 1.5, fill: true, backgroundColor: '#f1f5f920', pointRadius: 0, tension: 0.4 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      plugins: { legend: { display: false }, tooltip: { enabled: false } },
      scales: { x: { display: false }, y: { display: false } }
    }
  });
}
function generateSparkline() { return null; }

// ── Run ───────────────────────────────────────────────────────────────
const t0 = Date.now();
(async () => {
  await Promise.all([
    loadNewsSections(),   // sequential internally
    loadStocks(),         // parallel ok (no AI calls)
  ]);
  const s = ((Date.now() - t0) / 1000).toFixed(1);
  document.getElementById('hmeta').textContent =
    'Aktualisiert: ' + NOW.toLocaleTimeString('de-DE', { hour:'2-digit', minute:'2-digit' }) + ' · ' + s + 's';
})();
</script>
</body>
</html>
