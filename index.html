<script>
// ── Datum ──────────────────────────────────────────────────────────────
const NOW = new Date();
document.getElementById('hdate').textContent = NOW.toLocaleDateString('de-DE',
  { weekday:'long', year:'numeric', month:'long', day:'numeric' });

// ── Datum-Hilfsfunktion ────────────────────────────────────────────────
function formatNewsDate(dateStr) {
  const today = NOW.toISOString().slice(0,10);
  if (dateStr === today) return '📅 heute';
  const yest = new Date(NOW);
  yest.setDate(yest.getDate() - 1);
  if (dateStr === yest.toISOString().slice(0,10)) return '📅 gestern';
  const d = new Date(dateStr + 'T00:00:00');
  return '📅 ' + d.toLocaleDateString('de-DE', { month:'short', day:'numeric' });
}

// ── News-Item HTML ─────────────────────────────────────────────────────
function newsItemHTML(it) {
  return `<div class="news-item">
    <a href="${it.url}" target="_blank" rel="noopener">${it.text}</a>
    <div class="src">↗ ${it.source}</div>
    <div class="date-tag">${formatNewsDate(it.date)}</div>
  </div>`;
}

// ── Deutsche Wirtschaft rendern ────────────────────────────────────────
function renderEconomyNews() {
  const econ = NEWS_DATA.economy;
  document.getElementById('title-eco').textContent = econ.title;
  document.getElementById('body-eco').innerHTML = `
    <div class="news-grid">${econ.items.map(newsItemHTML).join('')}</div>
    <div class="news-updated">🔄 Stand ${NEWS_DATA.generated} · automatisch via WebSearch</div>`;
}

// ── Technologie-Kategorien rendern ─────────────────────────────────────

  const subs = NEWS_DATA.technology.subcategories;

    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:16px">

      🔄 Stand ${NEWS_DATA.generated} · automatisch via WebSearch
    </div>`;
}

// ── Refresh-Button: zeigt Datenstand, kein API-Call ────────────────────
// (Aktualisierung erfolgt täglich 06:00 Uhr via Cowork scheduled task)
document.getElementById('refresh-btn').addEventListener('click', () => {
  const toast = document.getElementById('refresh-toast');
  const today = NOW.toISOString().slice(0,10);
  if (NEWS_DATA.generated === today) {
    toast.textContent = '✅ Daten sind aktuell (Stand: heute)';
  } else {
    toast.textContent = `ℹ️ Stand ${NEWS_DATA.generated} – nächste Aktualisierung morgen 06:00 Uhr`;
  }
  setTimeout(() => { toast.textContent = ''; }, 4000);
});

// ── Initialer Render ───────────────────────────────────────────────────

renderTechnologyNews();

    const arrow = isPos ? '▲' : isNeg ? '▼' : '–';

    const card = document.createElement('div');
    card.className = 'stock-card';
    card.innerHTML = `
      <div class="s-sym">${s.sym} <span style="font-weight:400;opacity:.6">${s.exchange}</span></div>
      <div class="s-name">${s.name.trim()}</div>
      <div class="s-price">${s.price.toString().trim()}<span class="s-curr">${s.currency}</span></div>
      <div class="s-chg ${cls}"><span>${arrow}</span>${Math.abs(chg).toFixed(2)}% heute</div>
      <div class="s-age">🔄 ${age} · WebSearch</div>`;
    grid.appendChild(card);
  }
})();

// ── Meta footer ────────────────────────────────────────────────────────
document.getElementById('hmeta').innerHTML =
  'Börse: Stand ' + STOCK_DATA.generated + '<br>' +
  'News: Stand ' + NEWS_DATA.generated + '<br>' +
  'Täglich 06:00 Uhr aktualisiert';
</script>
</body>
</html>
