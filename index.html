<style>
:root {
  color-scheme: dark;

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0 }
body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif; font-size:13px; line-height:1.5; padding:16px; min-height:100vh }
::-webkit-scrollbar { width:5px } ::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px }

/* Header */
.header { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 20px; display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; box-shadow:var(--shadow) }
.header h1 { font-size:1.2rem; font-weight:700; letter-spacing:-.02em }
.header .date { color:var(--sub); font-size:.77rem; margin-top:2px }
.header .meta { color:var(--sub); font-size:.72rem; text-align:right; line-height:1.7 }

/* Section label */
.sec { font-size:.62rem; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:var(--sub); margin:14px 0 8px; display:flex; align-items:center; gap:8px }
.sec::after { content:''; flex:1; height:1px; background:var(--border) }

/* News */
.news-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:14px }
.news-card { background:var(--card); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); display:flex; flex-direction:column; height:300px }
.news-head { padding:12px 14px 0; flex-shrink:0 }
.card-title { font-size:.67rem; font-weight:700; text-transform:uppercase; letter-spacing:.09em; color:var(--accent); margin-bottom:8px }
.news-scroll { flex:1; overflow-y:auto; padding:0 14px 12px; min-height:0 }
.news-item { padding:8px 0; border-bottom:1px solid var(--border) }
.news-item:last-child { border-bottom:none }
.news-item a { color:var(--text); text-decoration:none; font-size:.79rem; line-height:1.45; display:block; font-weight:500 }
.news-item a:hover { color:var(--accent) }
.news-item .src { font-size:.68rem; color:var(--sub); margin-top:2px }
.news-updated { font-size:.68rem; color:var(--sub); margin-top:10px; padding-top:8px; border-top:1px solid var(--border) }

/* Stock grid */
.stocks-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px }
.stock-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:13px 14px 12px; box-shadow:var(--shadow); position:relative; overflow:hidden }
.s-sym  { font-size:.59rem; font-weight:700; color:var(--sub); text-transform:uppercase; letter-spacing:.07em }
.s-name { font-size:.72rem; font-weight:600; color:var(--text); line-height:1.3; margin:3px 0 10px; min-height:30px }
.s-price { font-size:1.05rem; font-weight:700; letter-spacing:-.02em; color:var(--text) }
.s-curr { font-size:.65rem; color:var(--sub); margin-left:2px; font-weight:500 }
.s-chg  { font-size:.72rem; font-weight:700; margin:3px 0 10px; display:flex; align-items:center; gap:3px }
.s-chg .arrow { font-size:.65rem }
.pos { color:var(--green) } .neg { color:var(--red) } .flat { color:var(--sub) }
.chart-box { height:48px; margin-top:2px }
.s-age { font-size:.62rem; color:var(--sub); margin-top:8px; border-top:1px solid var(--border); padding-top:6px }
</style>

<div class="sec">📈 Börsenübersicht</div>

<script>
// ── Date header ────────────────────────────────────────────────────────
const NOW = new Date();
document.getElementById('hdate').textContent = NOW.toLocaleDateString('de-DE',
  { weekday:'long', year:'numeric', month:'long', day:'numeric' });

// ── Render news ────────────────────────────────────────────────────────
(function renderNews() {
  const sections = [
    { key:'ai',  titleId:'title-ai',  bodyId:'body-ai'  },
    { key:'dc',  titleId:'title-dc',  bodyId:'body-dc'  },
    { key:'eco', titleId:'title-eco', bodyId:'body-eco' },
  ];
  const today = NOW.toISOString().slice(0,10);
  const age   = NEWS_DATA.generated === today ? 'heute aktualisiert' : 'Stand: ' + NEWS_DATA.generated;

  for (const { key, titleId, bodyId } of sections) {
    const sec = NEWS_DATA[key];
    document.getElementById(titleId).textContent = sec.title;
    const html = sec.items.map(it =>
      `<div class="news-item">
        <a href="${it.url}" target="_blank" rel="noopener">${it.text}</a>
        <div class="src">↗ ${it.source}</div>
      </div>`
    ).join('') + `<div class="news-updated">🔄 ${age} · automatisch via WebSearch</div>`;
    document.getElementById(bodyId).innerHTML = html;
  }
})();

// ── Render stocks ──────────────────────────────────────────────────────
(function renderStocks() {
  const grid  = document.getElementById('sgrid');
  const today = NOW.toISOString().slice(0,10);
  const age   = STOCK_DATA.generated === today ? 'heute' : 'Stand ' + STOCK_DATA.generated;

  for (const s of STOCK_DATA.stocks) {
    const chg    = parseFloat(s.change_pct);
    const isPos  = chg > 0.05;
    const isNeg  = chg < -0.05;
    const cls    = isPos ? 'pos' : isNeg ? 'neg' : 'flat';
    const arrow  = isPos ? '▲' : isNeg ? '▼' : '–';
    const color  = isPos ? '#3fb950' : isNeg ? '#f85149' : '#8b949e';
    const cid    = 'cv_' + s.sym;

    const card = document.createElement('div');
    card.className = 'stock-card';
    card.innerHTML = `
      <div class="s-sym">${s.sym} <span style="font-weight:400;opacity:.6">${s.exchange}</span></div>
      <div class="s-name">${s.name}</div>
      <div class="s-price">${s.price}<span class="s-curr">${s.currency}</span></div>
      <div class="s-chg ${cls}"><span class="arrow">${arrow}</span>${Math.abs(chg).toFixed(2)}% heute</div>
      <div class="chart-box"><canvas id="${cid}"></canvas></div>
      <div class="s-age">🔄 ${age} · WebSearch</div>`;
    grid.appendChild(card);

    // Decorative trend chart colored by direction
    requestAnimationFrame(() => {
      const el = document.getElementById(cid);
      if (!el) return;
      const len = 30;
      // simulate a mini trend: slight drift matching the change direction
      const drift = chg * 0.08;
      const pts = Array.from({ length: len }, (_, i) =>
        50 + drift * i + 5 * Math.sin(i * 0.6 + (s.sym.charCodeAt(0) % 5)) + (Math.random() - 0.5) * 1.2
      );
      new Chart(el, {
        type: 'line',
        data: {
          labels: pts.map((_, i) => i),
          datasets: [{ data: pts, borderColor: color, borderWidth: 1.5, fill: true,
            backgroundColor: color + '18', pointRadius: 0, tension: 0.4 }]
        },
        options: { responsive: true, maintainAspectRatio: false, animation: false,
          plugins: { legend: { display: false }, tooltip: { enabled: false } },
          scales: { x: { display: false }, y: { display: false } } }
      });
    });
  }
})();

// ── Meta footer ────────────────────────────────────────────────────────
document.getElementById('hmeta').innerHTML =
  'Börse: Stand ' + STOCK_DATA.generated + '<br>' +
  'News: Stand ' + NEWS_DATA.generated + '<br>' +
  'Täglich 06:00 Uhr aktualisiert';
</script>
